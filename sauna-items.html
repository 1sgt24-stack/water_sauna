<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사우나 소모품 관리</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311756a'/%3E%3Crect x='20' y='22' width='24' height='32' rx='6' fill='%23fff'/%3E%3Crect x='28' y='12' width='8' height='12' rx='2' fill='%23fff'/%3E%3Crect x='34' y='12' width='12' height='4' rx='2' fill='%23fff'/%3E%3Crect x='24' y='34' width='16' height='10' rx='2' fill='%23bfe8df'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b4a44">
<meta name="apple-mobile-web-app-title" content="사우나 소모품">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f2f6f5; --card:#fff; --ink:#1b2a28; --sub:#667a76; --line:#e1e9e7;
    --main:#11756a; --main-soft:#e3f4f0; --main-dark:#0b4a44;
    --orange:#e98a2a; --orange-soft:#fff2e4; --red:#d64545; --red-soft:#fdecec; --green:#1f9d63; --green-soft:#e6f6ee;
    --blue:#2f6fb8; --blue-soft:#e8f0fa; --violet:#6a4fb8; --violet-soft:#f0ecfa;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:15px;padding-bottom:40px;-webkit-text-size-adjust:100%}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* 상단 메뉴바 (홈페이지형) */
  .topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .topbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 16px;height:64px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:0 0 auto;cursor:pointer}
  .brand .ic{width:36px;height:36px;border-radius:9px;background:var(--main);display:grid;place-items:center}
  .brand .ic svg{width:24px;height:24px}
  .brand b{font-size:17px;letter-spacing:-.3px;display:block}
  .brand small{font-size:11px;color:var(--sub);display:block;margin-top:1px}
  nav{display:flex;gap:4px;flex:1;justify-content:center}
  nav button{border:0;background:none;padding:9px 13px;border-radius:10px;font-size:14px;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  nav button b{font-size:17px;font-weight:400}
  nav button:hover{background:#eef4f3;color:var(--ink)}
  nav button.on{background:var(--main-soft);color:var(--main);font-weight:700}
  #sync{font-size:11px;padding:5px 10px;border-radius:20px;background:var(--green-soft);color:var(--green);white-space:nowrap;flex:0 0 auto}
  #sync.local{background:var(--orange-soft);color:#a3580f}
  main{max-width:1080px;margin:0 auto;padding:0 16px}

  /* 현황 배너 */
  .hero{background:linear-gradient(120deg,#0b4a44 0%,#11756a 55%,#3fb59a 100%);color:#fff;border-radius:20px;padding:22px 22px 20px;margin:16px 0 4px;position:relative;overflow:hidden}
  .hero .art{position:absolute;right:-6px;bottom:-30px;width:230px;height:230px;opacity:.1;pointer-events:none}
  .hero .ht{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
  .hero h2{margin:0;font-size:20px;letter-spacing:-.3px}
  .hero .d{font-size:12px;opacity:.85;margin-top:4px}
  .hero .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn-w{background:#fff;color:var(--main-dark);border:0;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-w.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .hero .kpis{margin-top:18px;position:relative;z-index:1}
  .hero .kpi{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.2);text-align:left;color:#fff}
  .hero .kpi .l{color:rgba(255,255,255,.85)}
  .hero .kpi .v{color:#fff}
  .hero .kpi .v span{color:rgba(255,255,255,.8)}
  .hero .kpi .s{color:rgba(255,255,255,.8)}
  .hero .kpi.warn{background:rgba(255,95,95,.38)}
  .hero .bar{height:5px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:7px;overflow:hidden}
  .hero .bar i{display:block;height:100%;background:#fff;border-radius:9px}
  .hero .bar.over i{background:#ffb4b4}

  .card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 3px rgba(20,60,55,.06);padding:14px;margin:12px 0}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .card h2 small{font-weight:400;color:var(--sub);font-size:12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cols>.card{margin:0}
  .cols{margin:12px 0}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:var(--card);border-radius:var(--r);padding:12px 10px;box-shadow:0 1px 3px rgba(20,60,55,.06);border:0;font:inherit;color:inherit;text-align:left;min-width:0}
  button.kpi{cursor:pointer}
  .kpi .l{font-size:12px;color:var(--sub)}
  .kpi .v{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .v span{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
  .kpi .s{font-size:11px;color:var(--sub);margin-top:2px}

  /* 진단 */
  .diag{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .diag:last-child{border-bottom:0}
  .diag .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 30px}
  .diag.bad .ic{background:var(--red-soft);color:var(--red)}
  .diag.warn .ic{background:var(--orange-soft);color:#b25e0d}
  .diag.ok .ic{background:var(--green-soft);color:var(--green)}
  .diag .b{flex:1;min-width:0;font-size:14px}
  .diag .b small{display:block;font-size:12px;color:var(--sub);margin-top:2px}

  /* 분류별 재고 카드 */
  .grp{border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:12px;padding:12px;margin-top:10px}
  .grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .grp-h b{color:var(--gc);font-size:15px}
  .grp-h span{font-size:12px;color:var(--sub)}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .item{border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;position:relative;background:#fbfdfc;cursor:pointer;font:inherit;color:inherit}
  .item:hover{border-color:var(--gc)}
  .item .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .ok{font-size:24px;font-weight:800;color:var(--gc);margin:4px 0 0;font-variant-numeric:tabular-nums}
  .item .ok span{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
  .item .mn{font-size:11px;color:var(--sub)}
  .item.none .ok{color:#c3cfcc}
  .item.low{background:var(--red-soft);border-color:#f2b6b6}
  .item.low .ok{color:var(--red)}
  .item .lowtag{position:absolute;top:5px;right:5px;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px}

  /* 품목 카드 (사진) */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;min-width:0}
  .pcard:hover{border-color:var(--main)}
  .pcard.low{border-color:#f2b6b6}
  .pcard.off{opacity:.55}
  .thumb{aspect-ratio:4/3;width:100%;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ini{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .thumb .badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--red);color:#fff}
  .thumb .badge.mute{background:#7d8d8a}
  .pcard .bd{padding:9px 11px 11px;display:grid;gap:1px}
  .pcard .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .sp{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .q{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;gap:6px}
  .pcard .q b{font-size:19px;font-variant-numeric:tabular-nums}
  .pcard .q b small{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
  .pcard.low .q b{color:var(--red)}
  .pcard .q span{font-size:12px;color:var(--sub);white-space:nowrap}
  .addcard{border:1.5px dashed #c8d6d2;background:none;border-radius:14px;color:var(--sub);font-size:14px;min-height:170px;cursor:pointer;font-family:inherit}
  .mini{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 38px;overflow:hidden}
  .mini img{width:100%;height:100%;object-fit:cover}

  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
  .t-buy{background:var(--main-soft);color:var(--main)}
  .t-count{background:var(--blue-soft);color:var(--blue)}
  .t-warn{background:var(--orange-soft);color:#b25e0d}
  .t-bad{background:var(--red-soft);color:var(--red)}
  .t-mute{background:#eef2f1;color:#5b6b68}
  .t-ok{background:var(--green-soft);color:var(--green)}
  .seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .seg button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
  .seg button .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .seg.small button{padding:5px 11px;font-size:12px}
  .mon{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:99px}
  .mon button{border:0;background:none;width:34px;height:34px;font-size:16px;color:var(--sub);cursor:pointer}
  .mon span{font-size:13px;font-weight:700;min-width:96px;text-align:center}
  .bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}

  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--main-soft);border-color:var(--main)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .stepper button{border:0;background:none;width:46px;height:44px;font-size:21px;color:var(--main);cursor:pointer}
  .stepper input{border:0;text-align:center;flex:1;min-width:0;border-radius:0;font-size:18px;font-weight:700;padding:8px 0}
  .stepper input:focus{outline:0}
  .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .pick{border:2px solid var(--line);border-radius:12px;background:#fff;padding:0;overflow:hidden;cursor:pointer;text-align:center;min-width:0;font:inherit;color:inherit}
  .pick .thumb{aspect-ratio:16/10}
  .pick .thumb .ini{font-size:18px}
  .pick div.t{font-size:12px;padding:5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick.on{border-color:var(--main)}
  .pick.on div.t{font-weight:700;color:var(--main)}
  .sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--main-soft);border-radius:10px;padding:12px 14px;margin:14px 0 0}
  .sum b{font-size:20px}
  .note{font-size:12px;padding:8px 10px;border-radius:8px;margin:8px 0 0;line-height:1.5}
  .note.warn{background:var(--orange-soft);color:#8a4b0c}
  .note.info{background:#eef3f2;color:#4f625e}
  .note.bad{background:var(--red-soft);color:#9b2c2c}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--sub);font-weight:500;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#f6faf9}
  tfoot td{font-weight:700;background:#f6faf9}
  td input{padding:7px 8px;font-size:14px;text-align:right}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .cin{display:grid;grid-template-columns:38px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .cin .stepper button{width:40px;height:40px;font-size:19px}
  .cin .stepper input{font-size:16px}
  .bin{display:grid;grid-template-columns:38px minmax(0,1fr) 84px 108px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .bin input{text-align:right;padding:8px}
  .nm2{min-width:0}
  .nm2 div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
  .nm2 small{font-size:11px;color:var(--sub)}

  .btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--main);color:#fff;text-align:center}
  .btn.full{width:100%;margin-top:14px}
  .btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btn.gray{background:#eef2f1;color:var(--ink)}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.danger{background:var(--red)}
  .btn.danger-soft{background:var(--red-soft);color:var(--red)}
  .btn:disabled{opacity:.45;cursor:default}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btns .btn{flex:1}
  .link{border:0;background:none;color:var(--main);font-size:13px;font-weight:600;cursor:pointer;padding:0}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.55}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin-top:10px}
  .chk input{width:18px;height:18px;accent-color:var(--main)}
  .empty{color:var(--sub);text-align:center;padding:22px 0;font-size:14px}

  .log{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
  .log:last-child{border-bottom:0}
  .log:hover{background:#f6faf9}
  .log .d{font-size:12px;color:var(--sub);width:46px;flex:0 0 46px}
  .log .b{flex:1;min-width:0}
  .log .b .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .b .m{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .r{text-align:right;flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums}
  .dh{font-size:12px;font-weight:700;color:var(--sub);padding:14px 4px 4px}

  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* 모달 */
  .veil{position:fixed;inset:0;z-index:40;background:rgba(10,25,22,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px;padding:20px 20px 18px;animation:up .18s ease-out}
  .sheet.wide{max-width:720px}
  .sheet h3{font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sheet .desc{font-size:13px;color:var(--sub);margin:0 0 6px}
  .x{border:0;background:none;color:#9aa9a6;font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
  @keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .det{display:flex;gap:14px;align-items:flex-start;margin:6px 0 14px}
  .det .ph{width:104px;flex:0 0 104px;border-radius:12px;overflow:hidden;position:relative}
  .det .ph .thumb{aspect-ratio:1}
  .det .ph label{position:absolute;right:6px;bottom:6px;margin:0;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;font-weight:700;padding:3px 8px;cursor:pointer;color:var(--ink)}
  .dq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .dq div{background:#f3f7f6;border-radius:10px;padding:10px;min-width:0}
  .dq span{font-size:11px;color:var(--sub);display:block}
  .dq b{font-size:17px;white-space:nowrap}
  .sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2a28;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  /* 보고서 */
  .rep-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .paper{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(20,50,45,.12);padding:28px 30px;margin:12px auto;max-width:794px;color:#111}
  .paper .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--main-dark);padding-bottom:10px;margin-bottom:14px;gap:12px}
  .paper h1{font-size:22px;margin:0;letter-spacing:-.4px}
  .paper .rmeta{font-size:12px;color:#555;margin-top:4px}
  .appr{border-collapse:collapse;font-size:11px;width:auto;flex:0 0 auto}
  .appr td,.appr th{border:1px solid #999;text-align:center;padding:3px 0;width:62px}
  .appr th{background:#f2f4f3;color:#333;font-weight:600}
  .appr td{height:44px}
  .paper h3{font-size:14px;margin:18px 0 6px;color:var(--main-dark)}
  .rk{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #c9d6d3}
  .rk div{padding:10px;border-right:1px solid #c9d6d3;text-align:center}
  .rk div:last-child{border-right:0}
  .rk span{display:block;font-size:11px;color:#555}
  .rk b{font-size:19px}
  .rt{width:100%;border-collapse:collapse;font-size:12.5px}
  .rt th,.rt td{border:1px solid #c9d6d3;padding:6px 7px;color:#111}
  .rt th{background:#eaf3f1;text-align:center;font-weight:700;font-size:12px}
  .rt td{text-align:right;font-variant-numeric:tabular-nums}
  .rt td:first-child{text-align:left;font-weight:600;white-space:nowrap}
  .rt tr.tot td{background:#f3f8f7;font-weight:800}
  .rt td.zero{color:#aaa}
  .rnote{font-size:11px;color:#555;margin-top:6px;line-height:1.5}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;padding:0}
    .topbar,.toast,.veil,main>section:not(#tab-report),.rep-tools,.no-print,#repSeg{display:none!important}
    #tab-report{display:block!important}

<script>
/* ============================================================
   사우나 소모품 관리 (sauna-items.html) — 홈페이지형 개편판
   데이터: Firebase Firestore  sauna_purchase_v1 / live_v3  (이전 버전과 같은 문서)
   ============================================================ */
const FIREBASE_CONFIG={apiKey:"AIzaSyABtJnwGMAhEPEfsSCSf_cd6glzB_Fwan08",authDomain:"test-f82c9.firebaseapp.com",projectId:"test-f82c9",
  storageBucket:"test-f82c9.firebasestorage.app",messagingSenderId:"1064652444751",appId:"1:1064652444751:web:0788f6687896aedf82063a"};
const CLOUD_COL='sauna_purchase_v1',CLOUD_DOC='live_v3',LEGACY_COL='sauna_v1',LOCAL_KEY='sauna_items_v3';
const CLIENT=Math.random().toString(36).slice(2);
const ARR=['cats','items','vendors','purchases','stockLogs'], MAP=['visitors','targets','budgets','perHeadSet','usage','plans','meta'];
const VIS='워터파크 입장객', VAT='부가세 포함';
const PALETTE=['#11756a','#2f6fb8','#b5772f','#7a4f8c','#b0485f','#5e6e2c'];
const PAL_SOFT=['#e3f4f0','#e3ecf7','#f5ebdd','#efe6f3','#f6e3e7','#ebefdd'];
const ART=`<svg class="art" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M70 60h36v-18h22"/><rect x="58" y="60" width="60" height="110" rx="18"/><path d="M74 110h28M74 132h28"/><rect x="132" y="96" width="44" height="74" rx="12"/><path d="M146 96v-12h16v12"/><path d="M40 52c-10-12 10-18 0-30M24 64c-10-12 10-18 0-30M176 70c-8-10 8-15 0-25"/></svg>`;

let S=null, mode='local', fdb=null, docRef=null;
let tab='home', inSeg='buy', itemCat='', showOff=false, logYm='', logType='', logItem='';
let repSeg='month', repYm='', planYm='', planSrc='auto', planManual='', annYear=0, anaItem='', yearSel=0, countYm='';
let buy=null, prefillBulk=null, detailId=null;
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem('sauna_pref_'+k);localStorage.setItem('sauna_pref_'+k,v)}catch(e){return null}};
let apprOn=pref('appr')!=='0', lastItem=pref('last')||'';

/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ymOf=d=>(d||'').slice(0,7);
const curYm=()=>ymOf(today());
const addYm=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};
const ymKo=ym=>{const [y,m]=ym.split('-');return `${y}년 ${+m}월`};
const mKo=ym=>(+ym.slice(5))+'월';
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return ym+'-'+pad(new Date(y,m,0).getDate())};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const man=v=>(Math.round(v/1000)/10).toLocaleString('ko-KR');
const fmt1=n=>n==null?'-':(Number.isInteger(+n)?String(+n):(+n).toFixed(1));
const has=v=>v!=null&&v!==''&&!isNaN(v);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400)}
function loadScript(src,ms=6000){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;const to=setTimeout(()=>rej(new Error('timeout')),ms);
  s.onload=()=>{clearTimeout(to);res()};s.onerror=()=>{clearTimeout(to);rej(new Error('load'))};document.head.appendChild(s)})}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function copyText(tsv,msg){const fb=()=>{openSheet(`<h3>복사할 내용 <button class="x" data-act="close">×</button></h3><p class="desc">아래를 전체 선택(Ctrl+A)해서 복사한 뒤 엑셀에 붙여넣으세요.</p><textarea id="cp" style="height:220px;font-size:12px">${esc(tsv)}</textarea>`);$('#cp').select()};
  try{navigator.clipboard.writeText(tsv).then(()=>toast(msg||'복사했어요 · 엑셀에 붙여넣으세요'),fb)}catch(e){fb()}}

/* ---------- 데이터 변경 (기록 단위로 합쳐 저장 → 여러 기기에서 동시에 써도 지워지지 않음) ---------- */
let dirty={};
const touch=(c,k)=>{(dirty[c]=dirty[c]||new Set()).add(k)};
function upsert(c,o){const a=S[c],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);touch(c,o.id)}
function patch(c,id,d){const o=S[c].find(x=>x.id===id);if(o){Object.assign(o,d);touch(c,id)}return o}
function removeRec(c,id){S[c]=S[c].filter(x=>x.id!==id);touch(c,id)}
function setMap(c,k,v){if(v==null||v===''||(typeof v==='number'&&isNaN(v)))delete S[c][k];else S[c][k]=v;touch(c,k)}
function replaceAll(n){S=normalize(n);dirty={__all:true}}
function normalize(s){s=s||{};const o={budget:s.budget||0};ARR.forEach(c=>o[c]=Array.isArray(s[c])?s[c]:[]);MAP.forEach(c=>o[c]=s[c]&&typeof s[c]==='object'?s[c]:{});return o}
function mergeState(remote,local,d){
  if(d.__all)return JSON.parse(JSON.stringify(local));
  const out=normalize(JSON.parse(JSON.stringify(remote)));
  ARR.forEach(c=>{if(!d[c])return;const m=new Map(out[c].map(x=>[x.id,x]));
    d[c].forEach(id=>{const l=local[c].find(x=>x.id===id);if(l)m.set(id,JSON.parse(JSON.stringify(l)));else m.delete(id)});out[c]=[...m.values()]});
  MAP.forEach(c=>{if(!d[c])return;d[c].forEach(k=>{if(local[c][k]!==undefined)out[c][k]=JSON.parse(JSON.stringify(local[c][k]));else delete out[c][k]})});
  out.purchases.sort((a,b)=>a.date.localeCompare(b.date));return out}
let saveTimer=null,saving=false;
function save(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(S))}catch(e){}
  if(mode!=='cloud'){dirty={};return}clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return}
  const d=dirty;if(!Object.keys(d).length)return;dirty={};saving=true;
  try{let merged;
    await fdb.runTransaction(async tx=>{const snap=await tx.get(docRef);merged=mergeState(snap.exists?normalize(snap.data().state):normalize({}),S,d);
      tx.set(docRef,{state:merged,clientId:CLIENT,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});
    S=mergeState(merged,S,dirty);
  }catch(e){console.warn(e);Object.entries(d).forEach(([c,v])=>{if(c==='__all')dirty.__all=true;else v.forEach(k=>touch(c,k))});
    toast(String(e).toLowerCase().includes('size')?'저장 용량을 넘었어요 · 사진 수를 줄여주세요':'저장 실패 · 인터넷 연결을 확인하세요')}
  finally{saving=false}}

/* ---------- 연결 ---------- */
async function initStore(){
  try{await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    fdb=firebase.firestore();docRef=fdb.collection(CLOUD_COL).doc(CLOUD_DOC);
    const snap=await withTimeout(docRef.get(),7000);mode='cloud';
    if(snap.exists){S=normalize(snap.data().state);const a=tidy(),b=patchData();if(a||b)await flush()}
    else{S=startState();await importLegacy(true);patchData();dirty={__all:true};await flush()}
    docRef.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;const d=s.data();if(!d||d.clientId===CLIENT)return;
      S=mergeState(normalize(d.state),S,dirty);render()});
  }catch(e){mode='local';let l=null;try{l=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')}catch(_){}
    S=normalize(l||startState());tidy();patchData();dirty={};try{localStorage.setItem(LOCAL_KEY,JSON.stringify(S))}catch(_){}}}
/* 한 번만 적용하는 자료 수정 (적용 기록은 meta에 남겨 다시 실행하지 않음) */
const PATCHES=[{id:'price-2026-11-28',run(){
  const nz=x=>String(x||'').replace(/\s|대용량|\(.*?\)/g,''),find=n=>S.items.find(i=>nz(i.name)===n)||S.items.find(i=>nz(i.name).includes(n));
  const set=(n,d)=>{const it=find(n);if(it)patch('items',it.id,d)};
  set('샴푸',{price:8975});set('바디워시',{price:8975});set('롤백',{unit:'box',price:41000});
  const cat=(S.cats.find(c=>c.name==='어메니티'&&c.group!=='equip')||S.cats.find(c=>c.group!=='equip')||{}).id||'';
  [['버블액',120000],['입욕제',65000]].forEach(([n,pr])=>{const it=find(n);if(it)patch('items',it.id,{price:pr,active:true});else upsert('items',newItem({name:n,catId:cat,unit:'개',price:pr}))})}}];
function patchData(){let ch=false;PATCHES.forEach(p=>{if(S.meta[p.id])return;p.run();setMap('meta',p.id,today());ch=true});return ch}
/* 비품 분류 정리: 품목이 없는 비품 분류는 지우고, 분류에 큰 분류 표시가 없으면 소모품으로 */
function tidy(){let ch=false;
  S.cats.filter(c=>c.group==='equip'&&!S.items.some(i=>i.catId===c.id)).map(c=>c.id).forEach(id=>{removeRec('cats',id);ch=true});
  S.cats.forEach(c=>{if(!c.group){c.group='cons';touch('cats',c.id);ch=true}});
  return ch}
function startState(){return normalize({
  cats:[{id:'c1',name:'어메니티',color:0,group:'cons'},{id:'c2',name:'위생·청소',color:1,group:'cons'},{id:'c3',name:'운영',color:2,group:'cons'}],
  items:[newItem({id:'i1',name:'대용량 바디워시',catId:'c1',unit:'통'}),newItem({id:'i2',name:'대용량 샴푸',catId:'c1',unit:'통'}),newItem({id:'i3',name:'롤백',catId:'c3',unit:'박스'})]})}
function newItem(o){return Object.assign({id:uid('i'),name:'',catId:'',spec:'',unit:'개',pack:1,vendorId:'',price:null,min:0,memo:'',photo:'',active:true,legacyId:null},o)}

/* 기존 사우나 프로그램(sauna_v1) 소모품 데이터 가져오기 — 여러 번 해도 중복 안 됨 */
async function importLegacy(silent){
  try{const col=fdb.collection(LEGACY_COL);
    const [si,sl,sv,sph]=await Promise.all(['items','consLogs','visitors','perHead'].map(d=>col.doc(d).get()));
    const old=(si.exists&&si.data().data||[]).filter(i=>i.type==='consumable');const logs=sl.exists&&sl.data().data||[];const vis=sv.exists&&sv.data().data||{};
    const oph=sph.exists&&sph.data().data||{};let ni=0,np=0,nu=0,nv=0;const map={};const nz=x=>String(x||'').replace(/\s|\(.*?\)/g,'');
    old.forEach(o=>{const on=nz(o.name);let it=S.items.find(i=>i.legacyId===String(o.id))||S.items.find(i=>!i.legacyId&&nz(i.name)===on)||S.items.find(i=>!i.legacyId&&on&&(nz(i.name).includes(on)||on.includes(nz(i.name))));
      if(!it){const cid=/롤백|비닐|건전지/.test(o.name)?(S.cats.find(c=>c.name==='운영')||S.cats[0]||{}).id:(S.cats.find(c=>c.name==='어메니티')||S.cats[0]||{}).id;
        it=newItem({name:o.name,catId:cid||'',unit:o.unit||'개'});upsert('items',it);ni++}
      patch('items',it.id,{legacyId:String(o.id),unit:it.unit||o.unit||'개',min:it.min||Number(o.minStock)||0});map[o.id]=it;
      if(has(o.stock)&&!S.stockLogs.some(l=>l.itemId===it.id&&l.legacy))
        upsert('stockLogs',{id:uid('s'),date:lastDay(addYm(curYm(),-1)),itemId:it.id,qty:Number(o.stock),memo:'기존 프로그램 재고',legacy:true})});
    logs.filter(l=>l.type==='in'&&map[l.itemId]&&l.date).forEach(l=>{const it=map[l.itemId];if(S.purchases.some(p=>p.legacyId===String(l.id)))return;
      upsert('purchases',{id:uid('p'),date:String(l.date).slice(0,10),itemId:it.id,qty:Number(l.qty)||0,price:null,vendorId:'',memo:l.note||'',legacyId:String(l.id)});np++});
    const use={};logs.filter(l=>l.type==='out'&&map[l.itemId]&&l.date).forEach(l=>{const it=map[l.itemId],m=ymOf(String(l.date));use[m]=use[m]||{};use[m][it.id]=(use[m][it.id]||0)+(Number(l.qty)||0);nu++});
    Object.entries(use).forEach(([m,v])=>setMap('usage',m,Object.assign({},S.usage[m]||{},v)));
    Object.entries(vis).forEach(([k,v])=>{if(/^\d{4}-\d{2}$/.test(k)&&v&&!S.visitors[k]){setMap('visitors',k,Number(v));nv++}});
    Object.entries(oph).forEach(([oid,v])=>{const it=map[oid];if(it&&v&&S.perHeadSet[it.id]==null)setMap('perHeadSet',it.id,Number(v))});
    S.purchases.sort((a,b)=>a.date.localeCompare(b.date));
    if(!silent){save();render();toast(`가져왔어요 · 품목 ${ni} · 구매 ${np}건 · 사용 ${nu}건 · 입장객 ${nv}개월`)}
  }catch(e){console.warn(e);if(!silent)toast('가져오기 실패 · 연결을 확인하세요')}}

/* 체험용 예시 데이터 (미리보기 전용) */
function demoState(){
  let a=7;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const s=startState();s.vendors=[{id:'v1',name:'바름위생상사 (예시)',contact:'김○○ 과장',phone:'031-000-0000',method:'전화 주문',memo:'매주 화요일 배송'},{id:'v2',name:'온라인 B2B몰 (예시)',contact:'',phone:'',method:'온라인 주문',memo:''}];
  const P={i1:[38000,'v1',16,22],i2:[42000,'v1',16,20],i3:[56000,'v2',4,5]};s.items.forEach(it=>{it.price=P[it.id][0];it.vendorId=P[it.id][1];it.min=P[it.id][2]});
  const f={'01':.7,'02':.75,'03':.6,'04':.8,'05':1,'06':1.25,'07':1.8,'08':1.9,'09':1.1,'10':.9,'11':.7,'12':.8};
  const vis={'01':16800,'02':17500,'03':13900,'04':18400,'05':22600,'06':28800,'07':41200,'08':44300,'09':25100,'10':20400,'11':16100,'12':18200};
  const stock={};const start='2025-01';
  s.items.forEach(it=>{stock[it.id]=it.min+P[it.id][3];s.stockLogs.push({id:uid('s'),date:'2024-12-31',itemId:it.id,qty:stock[it.id],memo:'월말 재고'})});
  for(let m=start;m<curYm();m=addYm(m,1)){const mm=m.slice(5),yf=m.startsWith('2026')?1.06:1;
    s.visitors[m]=Math.round(vis[mm]*yf*(0.95+rnd()*0.1));
    s.items.forEach(it=>{const cons=Math.round(P[it.id][3]*f[mm]*yf*(0.88+rnd()*0.24)),bq=Math.max(0,cons+it.min-stock[it.id]);
      if(bq)s.purchases.push({id:uid('p'),date:m+'-'+pad(3+Math.floor(rnd()*12)),itemId:it.id,qty:bq,price:it.price,vendorId:it.vendorId,memo:''});
      stock[it.id]=Math.max(0,stock[it.id]+bq-cons);s.stockLogs.push({id:uid('s'),date:lastDay(m),itemId:it.id,qty:stock[it.id],memo:'월말 재고'})})}
  const y=curYm().slice(0,4);['01','02','03','04','05','06','07','08','09','10','11','12'].forEach(mm=>{s.targets[y+'-'+mm]=Math.round(vis[mm]*1.08/100)*100;s.targets[(+y+1)+'-'+mm]=Math.round(vis[mm]*1.12/100)*100;
    s.budgets[y+'-'+mm]=mm==='07'||mm==='08'?2600000:1500000;s.budgets[(+y+1)+'-'+mm]=mm==='07'||mm==='08'?2800000:1600000});
  s.stockLogs.filter(l=>l.itemId==='i2').sort((a,b)=>a.date.localeCompare(b.date)).pop().qty=9;
  s.purchases.sort((x,y)=>x.date.localeCompare(y.date));return normalize(s)}

/* ---------- 계산 ---------- */
const itemById=id=>S.items.find(i=>i.id===id);
const vendorById=id=>S.vendors.find(v=>v.id===id);
const catById=id=>S.cats.find(c=>c.id===id);
const cats=()=>S.cats.filter(c=>c.group!=='equip');
const catOf=it=>catById(it.catId)||{id:'',name:'미분류',color:5,group:'cons'};
const cc=c=>PALETTE[(c.color??0)%PALETTE.length], cs=c=>PAL_SOFT[(c.color??0)%PAL_SOFT.length];

const priceOf=it=>has(it.price)?Number(it.price):lastPrice(it.id);
const sortLogs=a=>a.sort((x,y)=>x.date.localeCompare(y.date)||x.id.localeCompare(y.id));
function lastLog(id,until){return sortLogs(S.stockLogs.filter(l=>l.itemId===id&&(!until||l.date<=until))).pop()||null}
function countOf(id,ym){const l=sortLogs(S.stockLogs.filter(x=>x.itemId===id&&ymOf(x.date)===ym)).pop();return l?Number(l.qty):null}
function stockAt(id,date){const l=lastLog(id,date);if(!l)return null;return Number(l.qty)+S.purchases.filter(p=>p.itemId===id&&p.date>l.date&&p.date<=date).reduce((s,p)=>s+p.qty,0)}
const stockNow=id=>stockAt(id,'9999-12-31');
function monthLog(id,ym){return sortLogs(S.stockLogs.filter(x=>x.itemId===id&&ymOf(x.date)===ym)).pop()||null}
function used(id,ym){const A=monthLog(id,addYm(ym,-1)),B=monthLog(id,ym);
  if(A&&B)return Number(A.qty)+S.purchases.filter(p=>p.itemId===id&&p.date>A.date&&p.date<=B.date).reduce((s,p)=>s+p.qty,0)-Number(B.qty);const u=S.usage[ym];return u&&u[id]!=null?Number(u[id]):null}
function avgUse(id,base){base=base||curYm();const v=[];for(let i=0;i<8&&v.length<3;i++){const u=used(id,addYm(base,-i));if(u!=null)v.push(u)}return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function phStats(id){const ms=Object.keys(S.visitors).filter(m=>S.visitors[m]>0&&used(id,m)!=null).sort();if(!ms.length)return{n:0,ph:null,recent:null};
  const su=a=>a.reduce((s,m)=>s+used(id,m),0),sv=a=>a.reduce((s,m)=>s+S.visitors[m],0),r=ms.slice(-3);return{n:ms.length,ph:su(ms)/sv(ms),recent:su(r)/sv(r)}}
function appliedPh(id){const v=S.perHeadSet[id];return has(v)?Number(v):phStats(id).ph}
const isLow=it=>{const s=stockNow(it.id);return it.active!==false&&s!=null&&it.min>0&&s<it.min};

function planVisitors(T){const tg=Number(S.targets[T])||0,yoy=S.visitors[addYm(T,-12)]||0,prev=S.visitors[addYm(T,-1)]||0;
  const l3=[1,2,3].map(i=>S.visitors[addYm(T,-i)]||0).filter(v=>v>0);const avg3=l3.length?Math.round(l3.reduce((a,b)=>a+b,0)/l3.length):0;
  const opts={target:{v:tg,l:'목표 입장객'},yoy:{v:yoy,l:'작년 같은 달 실적'},prev:{v:prev,l:'지난달 실적'},avg3:{v:avg3,l:'최근 3개월 평균'},manual:{v:Number(planManual)||0,l:'직접 입력'}};
  let key=planSrc;if(key==='auto')key=tg?'target':yoy?'yoy':avg3?'avg3':'manual';return{key,v:opts[key].v,opts}}
function planRows(T,vis){const startDate=lastDay(addYm(T,-1));
  return active().map(it=>{const ph=appliedPh(it.id),au=avgUse(it.id);const exp=ph!=null&&vis?vis*ph:au;
    const st=T<=curYm()?stockNow(it.id):stockAt(it.id,startDate)??stockNow(it.id);const pr=priceOf(it);
    const rec=Math.max(0,Math.ceil(exp+it.min-(st??0)));return{it,exp,st,rec,price:pr,amt:rec*(pr||0),basis:ph!=null&&vis?'입장객 기준':au?'최근 평균':'자료 없음'}})}
/* 연간 계획: 같은 달의 1인당 사용량(지난 해들 평균) × 그 해 목표 입장객 → 월별 사용량 예측 → 재고를 이어가며 구매량 계산 */
function expFor(it,m){
  const tg=Number(S.targets[m])||0,ov=has(S.perHeadSet[it.id])?Number(S.perHeadSet[it.id]):null;
  const rates=[];for(let k=1;k<=4;k++){const pm=addYm(m,-12*k),u=used(it.id,pm),v=S.visitors[pm];if(u!=null&&v>0)rates.push(u/v)}
  const same=rates.length?rates.reduce((a,b)=>a+b,0)/rates.length:null,all=phStats(it.id).ph;
  if(tg&&ov!=null)return{exp:tg*ov,basis:'목표 입장객 × 조정값'};
  if(tg&&same!=null)return{exp:tg*same,basis:'목표 입장객 × 같은 달 1인당'};
  if(tg&&all!=null)return{exp:tg*all,basis:'목표 입장객 × 평균 1인당'};
  const ly=used(it.id,addYm(m,-12));if(ly!=null)return{exp:ly,basis:'작년 같은 달 사용량'};
  return{exp:avgUse(it.id),basis:'최근 평균 사용량'}}
function annualPlan(Y){
  const months=[...Array(12)].map((_,i)=>Y+'-'+pad(i+1)),startYm=curYm();
  const rows=active().map(it=>{
    let stock=stockNow(it.id)??0;
    for(let m=startYm;m<months[0];m=addYm(m,1)){const e=expFor(it,m).exp;stock=stock+Math.max(0,Math.ceil(e+it.min-stock))-e}
    const cells=months.map(m=>{const {exp,basis}=expFor(it,m);let qty=0;
      if(m>=startYm){qty=Math.max(0,Math.ceil(exp+it.min-stock));stock=stock+qty-exp}
      return{m,exp,qty,amt:qty*(priceOf(it)||0),basis,past:m<startYm}});
    return{it,cells}});
  return{months,rows}}
function activities(){return[...S.purchases.filter(p=>isConsId(p.itemId)).map(p=>({k:'buy',date:p.date,id:p.id,itemId:p.itemId,p})),

      <button class="btn ghost sm" data-act="exp-stock">현재 재고 엑셀용(CSV)</button>
      <label class="btn ghost sm" style="margin:0;color:var(--main)">백업 불러오기<input type="file" accept=".json" id="importFile" class="hidden"></label></div>
    <div class="hint">매달 초에 백업 파일을 한 번 받아두면 안전해요. 불러오기를 하면 지금 데이터가 백업 파일 내용으로 바뀌어요.</div></div>
  <div class="card"><h2>기존 프로그램 데이터</h2>
    <div class="hint" style="margin-top:0">${mode==='cloud'?'기존 사우나 프로그램(index.html)의 소모품 품목·구매·소모 기록·입장객을 가져와요. 이미 있는 기록은 건너뛰어요.':'미리보기에서는 기존 데이터에 연결할 수 없어요. GitHub 주소에서 열면 쓸 수 있어요.'}</div>
    ${mode==='cloud'?'<div class="btns" style="justify-content:flex-start"><button class="btn ghost sm" style="flex:0 0 auto" data-act="legacy">다시 가져오기</button></div>':''}
    ${hiddenEq?`<div class="note warn">예전에 비품으로 등록한 품목 ${hiddenEq}개가 숨겨져 있어요. 이 프로그램은 소모품만 관리해요. <button class="link" data-act="del-equip">비품 품목과 기록 지우기</button></div>`:''}</div>
  <div class="card"><h2>초기화</h2>
    <div class="btns" style="justify-content:flex-start;margin-top:0">${mode!=='cloud'?'<button class="btn gray sm" style="flex:0 0 auto" data-act="ask-demo">체험용 예시 데이터 넣기</button>':''}<button class="btn danger-soft sm" style="flex:0 0 auto" data-act="ask-reset">처음 상태로 되돌리기</button></div>
    <div id="confirmArea"></div></div>
  <div class="card"><h2>연결 정보</h2><div class="hint" style="margin-top:0">${mode==='cloud'?`실시간 연결 중 · Firebase ${FIREBASE_CONFIG.projectId} / ${CLOUD_COL}/${CLOUD_DOC}<br>여러 기기에서 동시에 입력해도 기록이 서로 지워지지 않게 합쳐서 저장해요.`:'미리보기 모드 · 입력한 내용은 이 기기 브라우저에만 저장돼요.'}<br>품목 ${consAll().length}개 · 구매 기록 ${S.purchases.length}건 · 재고 기록 ${S.stockLogs.length}건</div></div>`}
function catForm(id){const c=id?catById(id):{id:null,name:'',color:S.cats.length%PALETTE.length};const n=id?S.items.filter(i=>i.catId===id).length:0;
  openSheet(`<h3>${id?'분류 수정':'분류 추가'}<button class="x" data-act="close">×</button></h3><label for="cn">분류 이름</label><input id="cn" value="${esc(c.name)}" placeholder="예: 탈의실 소모품">
    <label>색</label><div style="display:flex;gap:8px">${PALETTE.map((p,i)=>`<button class="sw ${i===c.color?'on':''}" data-sw="${i}" style="background:${p}" aria-label="색 ${i+1}"></button>`).join('')}</div><input type="hidden" id="ccol" value="${c.color}">
    ${n?`<div class="note info">품목 ${n}개가 있어서 삭제할 수 없어요. 품목의 분류를 먼저 바꿔주세요.</div>`:''}
    <div class="btns">${id&&!n?`<button class="btn danger-soft" data-act="cat-del" data-id="${id}">삭제</button>`:''}<button class="btn" data-act="cat-save" data-id="${id||''}">저장</button></div>`)}
function vendorForm(id){const v=id?vendorById(id):{id:null,name:'',contact:'',phone:'',method:'전화 주문',memo:''};const usedV=v.id&&(S.items.some(i=>i.vendorId===v.id)||S.purchases.some(p=>p.vendorId===v.id));
  openSheet(`<h3>${v.id?'구매처 수정':'구매처 추가'}<button class="x" data-act="close">×</button></h3><label for="vn">업체명</label><input id="vn" value="${esc(v.name)}">
    <div class="row2"><div><label for="vc">담당자</label><input id="vc" value="${esc(v.contact)}"></div><div><label for="vp">연락처</label><input id="vp" type="tel" value="${esc(v.phone)}"></div></div>
    <label for="vm">주문 방법</label><select id="vm">${['전화 주문','온라인 주문','발주서 팩스','방문 구매','기타'].map(m=>`<option ${m===v.method?'selected':''}>${m}</option>`).join('')}</select>
    <label for="vme">메모</label><input id="vme" value="${esc(v.memo)}" placeholder="배송 요일, 결제 방식 등">
    ${usedV?'<div class="note info">품목이나 구매 기록에 연결된 구매처는 삭제할 수 없어요.</div>':''}
    <div class="btns">${v.id&&!usedV?`<button class="btn danger-soft" data-act="v-del" data-id="${v.id}">삭제</button>`:''}<button class="btn" data-act="v-save" data-id="${v.id||''}">저장</button></div>`)}
const toCsv=rows=>'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');

/* ---------- 모달 ---------- */
function openSheet(html,wide){$('#sheet').className='sheet'+(wide?' wide':'');$('#sheet').innerHTML=html;$('#veil').classList.remove('hidden');$('#sheet').scrollTop=0}
function closeSheet(){$('#veil').classList.add('hidden');$('#sheet').innerHTML='';detailId=null;if(buy&&buy.id)buy=null}
function armOrRun(t,fn,label){if(t.dataset.armed)fn();else{t.dataset.armed=1;t.textContent=label||'한 번 더 누르면 삭제'}}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-tab],tr[data-item]');if(!t||!S)return;const d=t.dataset;
  if(d.tab){go(d.tab);return}
  if(d.inseg){inSeg=d.inseg;if(inSeg!=='bulk')prefillBulk=null;render();return}
  if(d.rseg){repSeg=d.rseg;render();return}
  if(d.cat!==undefined&&t.closest('#tab-items')){itemCat=d.cat;render();return}
  if(d.item){itemDetail(d.item);return}
  if(d.edit){editBuy(d.edit);return}
  if(d.log){countOne(null,d.log);return}
  if(d.vendor){vendorForm(d.vendor);return}
  if(d.catedit){catForm(d.catedit);return}
  if(d.sw!==undefined){document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b===t));$('#ccol').value=d.sw;return}
  if(d.src){planSrc=d.src;render();return}
  if(d.pick){const p=d.p,it=itemById(d.pick);buy.itemId=it.id;t.parentElement.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on',b===t));
    if(!buy.id){$('#'+p+'pr').value=priceOf(it)??'';$('#'+p+'v').value=it.vendorId||''}updBuy(p);return}
  if(d.step){const i=$('#'+d.p+'q');i.value=Math.max(0,(Number(i.value)||0)+Number(d.step));updBuy(d.p);return}
  if(d.cstep){const i=$('#cs-'+d.for);i.value=Math.max(0,(Number(i.value)||0)+Number(d.cstep));return}
  if(d.onestep){const i=$('#cq');i.value=Math.max(0,(Number(i.value)||0)+Number(d.onestep));return}
  const D=Number(d.d)||0;
  switch(d.act){
    case 'close':closeSheet();break;
    case 'go-buy':inSeg='buy';buy=null;go('input');break;
    case 'go-count':inSeg='count';countYm=defaultCountYm();go('input');break;
    case 'go-year':inSeg='year';go('input');break;
    case 'go-items':go('items');break;
    case 'go-log':go('log');break;
    case 'go-report':repSeg='month';go('report');break;
    case 'go-plan':repSeg='plan';planYm=addYm(curYm(),1);go('report');break;
    case 'buy-this':{const id=d.id;closeSheet();inSeg='buy';startBuy(id);tab='input';render();window.scrollTo(0,0);break}
    case 'count-this':countOne(d.id);break;
    case 'buy-save':saveBuy(d.p,!!d.more);break;
    case 'buy-del':armOrRun(t,()=>{removeRec('purchases',buy.id);save();closeSheet();render();toast('구매 기록을 삭제했어요')});break;
    case 'bulk-save':saveBulk();break;
    case 'count-save':saveCount();break;
    case 'cnt-mon':countYm=addYm(countYm,D);render();break;
    case 'cnt-one-save':{const v=$('#cq').value;if(v===''){toast('수량을 입력하세요');break}
      upsert('stockLogs',{id:d.lid||uid('s'),date:$('#cd').value||today(),itemId:d.iid,qty:Number(v),memo:$('#cm').value.trim()});save();toast('재고를 저장했어요');
      const back=detailId;render();back?itemDetail(back):closeSheet();break}
    case 'cnt-del':armOrRun(t,()=>{removeRec('stockLogs',d.id);save();closeSheet();render();toast('재고 기록을 삭제했어요')});break;
    case 'year-nav':yearSel+=D;render();break;
    case 'year-save':{let n=0;document.querySelectorAll('[data-yk]').forEach(i=>{const k=i.dataset.yk,m=i.dataset.ym,v=i.value===''?null:Number(i.value),c=S[k][m]??null;if(v!==c){setMap(k,m,v);n++}});
      save();render();toast(n?`${yearSel}년 입장객·예산을 저장했어요`:'바뀐 내용이 없어요');break}
    case 'new-item':itemForm(null);break;
    case 'edit-item':itemForm(d.id);break;
    case 'item-save':saveItem(d.id);break;
    case 'item-del':armOrRun(t,()=>{const id=d.id;S.purchases.filter(p=>p.itemId===id).map(p=>p.id).forEach(x=>removeRec('purchases',x));S.stockLogs.filter(l=>l.itemId===id).map(l=>l.id).forEach(x=>removeRec('stockLogs',x));
      removeRec('items',id);save();closeSheet();render();toast('품목을 삭제했어요')},'정말 삭제할까요? 한 번 더 누르세요');break;
    case 'toggle-off':showOff=!showOff;render();break;
    case 'log-mon':logYm=addYm(logYm,D);render();break;
    case 'rep-mon':repYm=addYm(repYm,D);render();break;
    case 'plan-mon':planYm=addYm(planYm,D);render();break;
    case 'ann-nav':annYear+=D;render();break;
    case 'print':{const tl=document.title;document.title=`사우나소모품_월간보고_${repYm}`;setTimeout(()=>{window.print();document.title=tl},60);break}
    case 'plan-save':{const pv=planVisitors(planYm),rows=planRows(planYm,pv.v);setMap('plans',planYm,{visitors:pv.v,source:pv.opts[pv.key].l,total:rows.reduce((s,r)=>s+r.amt,0),
      rows:rows.filter(r=>r.rec).map(r=>({itemId:r.it.id,rec:r.rec,amt:r.amt})),savedAt:today()});save();render();toast(mKo(planYm)+' 계획을 저장했어요');break}
    case 'plan-bulk':{const pre={};planRows(planYm,planVisitors(planYm).v).forEach(r=>{if(r.rec)pre[r.it.id]=r.rec});prefillBulk=pre;inSeg='bulk';go('input');break}
    case 'plan-copy':{const pv=planVisitors(planYm);const rows=[[ymKo(planYm)+' 구매 계획',`예상 ${VIS}`,pv.v],['품목','수량','단위','단가',`예상 금액(${VAT})`,'구매처']];
      planRows(planYm,pv.v).filter(r=>r.rec).forEach(r=>rows.push([r.it.name,r.rec,r.it.unit,r.price??'',r.amt||'',(vendorById(r.it.vendorId)||{}).name||'']));copyText(rows.map(r=>r.join('\t')).join('\n'));break}
    case 'ann-copy':{const {months,rows}=annualPlan(annYear);const out=[[annYear+'년 구매계획(살 수량)',...months.map(mKo),'합계']];
      rows.forEach(r=>out.push([r.it.name+'('+r.it.unit+')',...r.cells.map(c=>c.past?'':c.qty),r.cells.reduce((s,c)=>s+c.qty,0)]));
      out.push(['예상 금액(원)',...months.map((m,i)=>rows.reduce((s,r)=>s+r.cells[i].amt,0)),rows.reduce((s,r)=>s+r.cells.reduce((a,c)=>a+c.amt,0),0)]);
      out.push(['예산(원)',...months.map(budgetOf),months.reduce((s,m)=>s+budgetOf(m),0)]);copyText(out.map(r=>r.join('\t')).join('\n'));break}
    case 'use-copy':{const rows=[['품목','단위','지난달 말','구매','이번 달 말','사용량']].concat(active().map(it=>[it.name,it.unit,countOf(it.id,addYm(repYm,-1))??'',boughtQty(it.id,repYm)||'',countOf(it.id,repYm)??'',used(it.id,repYm)??'']));copyText(rows.map(r=>r.join('\t')).join('\n'));break}
    case 'new-cat':catForm(null);break;
    case 'cat-save':{const nm=$('#cn').value.trim();if(!nm){toast('분류 이름을 입력하세요');break}const col=Number($('#ccol').value)||0;
      if(d.id)patch('cats',d.id,{name:nm,color:col});else upsert('cats',{id:uid('c'),name:nm,color:col,group:'cons'});save();closeSheet();render();toast(nm+' 저장했어요');break}
    case 'cat-del':armOrRun(t,()=>{removeRec('cats',d.id);if(itemCat===d.id)itemCat='';save();closeSheet();render();toast('분류를 삭제했어요')});break;
    case 'new-vendor':vendorForm(null);break;
    case 'v-save':{const v={name:$('#vn').value.trim(),contact:$('#vc').value.trim(),phone:$('#vp').value.trim(),method:$('#vm').value,memo:$('#vme').value.trim()};if(!v.name){toast('업체명을 입력하세요');break}
      if(d.id)patch('vendors',d.id,v);else upsert('vendors',{id:uid('v'),...v});save();closeSheet();render();toast(v.name+' 저장했어요');break}
    case 'v-del':armOrRun(t,()=>{removeRec('vendors',d.id);save();closeSheet();render();toast('구매처를 삭제했어요')});break;
    case 'exp-json':download(`사우나소모품_백업_${today()}.json`,JSON.stringify(S,null,2),'application/json');toast('백업 파일을 받았어요');break;
    case 'exp-csv':{const rows=[['날짜','구분','품목','수량','단위','단가','금액','구매처','메모']];
      activities().slice().reverse().forEach(a=>{const it=itemById(a.itemId)||{};if(a.k==='buy'){const p=a.p;rows.push([p.date,'구매',it.name,p.qty,it.unit,p.price??'',has(p.price)?amt(p):'',(vendorById(p.vendorId)||{}).name||'',p.memo||''])}
        else rows.push([a.l.date,'재고 확인',it.name,a.l.qty,it.unit,'','','',a.l.memo||''])});
      download(`사우나소모품_기록_${today()}.csv`,toCsv(rows),'text/csv;charset=utf-8');break}
    case 'exp-stock':{const rows=[['분류','품목','단위','남은 수량','최소 보유량','단가','재고 금액','구매처','상태']];
      consAll().forEach(it=>{const st=stockNow(it.id),pr=priceOf(it);rows.push([catOf(it).name,it.name,it.unit,st??'',it.min||0,pr??'',st!=null&&pr?st*pr:'',(vendorById(it.vendorId)||{}).name||'',it.active===false?'사용 안 함':isLow(it)?'부족':'정상'])});
      download(`사우나소모품_재고_${today()}.csv`,toCsv(rows),'text/csv;charset=utf-8');break}
    case 'legacy':importLegacy(false);break;
    case 'xl-cancel':xlPrev=null;render();break;
    case 'xl-apply':applyExcel();break;
    case 'del-equip':armOrRun(t,()=>{S.items.filter(i=>!isCons(i)).forEach(it=>{S.purchases.filter(p=>p.itemId===it.id).map(p=>p.id).forEach(x=>removeRec('purchases',x));S.stockLogs.filter(l=>l.itemId===it.id).map(l=>l.id).forEach(x=>removeRec('stockLogs',x));removeRec('items',it.id)});
      S.cats.filter(c=>c.group==='equip').map(c=>c.id).forEach(id=>removeRec('cats',id));save();render();toast('비품 품목을 지웠어요')},'정말 지울까요? 한 번 더 누르세요');break;
    case 'ask-demo':case 'ask-reset':{const m=d.act;$('#confirmArea').innerHTML=`<div class="note bad">${m==='ask-demo'?'지금 데이터를 지우고 체험용 예시 데이터로 바꿔요.':'모든 품목·기록을 지우고 처음 상태(3개 품목)로 되돌려요. 되돌릴 수 없어요.'+(mode==='cloud'?' 이후 기존 데이터는 "다시 가져오기"로 불러올 수 있어요.':'')}</div>
      <div class="btns" style="justify-content:flex-start"><button class="btn danger sm" style="flex:0 0 auto" data-act="do-reset" data-m="${m}">확인, 진행하기</button></div>`;break}
    case 'do-reset':replaceAll(d.m==='ask-demo'?demoState():startState());save();logYm='';repYm='';planYm='';render();toast('완료했어요');break;
  }});
$('#veil').addEventListener('click',e=>{if(e.target.id==='veil')closeSheet()});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='bq'||id==='bpr'){updBuy('b');return}if(id==='eq'||id==='epr'){updBuy('e');return}
  if(e.target.dataset.bq||e.target.dataset.bp)bulkTotals()});
document.addEventListener('change',e=>{const t=e.target,id=t.id;
  if(id==='bv'||id==='ev'){const p=id[0];$('#'+p+'vnw').classList.toggle('hidden',t.value!=='__new');if(t.value==='__new')$('#'+p+'vn').focus()}
  if(id==='logType'){logType=t.value;render()}
  if(id==='logItem'){logItem=t.value;render()}
  if(id==='anaItem'){anaItem=t.value;render()}
  if(id==='planVis'){planManual=t.value;render()}
  if(id==='repAppr'){apprOn=t.checked;pref('appr',apprOn?'1':'0');render()}
  if(t.dataset.photo){setPhoto(t.dataset.photo,t.files[0])}
  if(t.dataset.ph){const v=t.value.trim();setMap('perHeadSet',t.dataset.ph,v===''?null:Number(v)/10000);save();render();toast('조정값을 저장했어요')}
  if(id==='xlFile'&&t.files.length){const fs=[...t.files];xlBusy=true;render();readExcel(fs).then(p=>{xlPrev=p;xlBusy=false;render()}).catch(err=>{console.warn(err);xlBusy=false;render();toast(err&&err.message&&!/timeout|load/.test(err.message)?err.message:'엑셀을 읽지 못했어요 · 인터넷 연결을 확인하세요')})}
  if(id==='importFile'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.items))throw 0;replaceAll(o);tidy();save();render();toast('백업을 불러왔어요')}catch(_){toast('백업 파일을 읽을 수 없어요')}};rd.readAsText(t.files[0])}});
/* 입장객·예산 표: 엑셀에서 12개월 숫자 붙여넣기 → 아래로 채우기 */
document.addEventListener('paste',e=>{const t=e.target;if(!t.dataset||!t.dataset.yk)return;const txt=(e.clipboardData||window.clipboardData).getData('text');
  const vals=txt.split(/\r?\n|\t/).map(s=>s.replace(/[,\s원명]/g,'')).filter(s=>s!=='');if(vals.length<2)return;e.preventDefault();
  const k=t.dataset.yk,st=Number(t.dataset.yi);vals.forEach((v,j)=>{const el=document.querySelector(`[data-yk="${k}"][data-yi="${st+j}"]`);if(el&&!isNaN(v))el.value=Number(v)});toast(`${Math.min(vals.length,12-st)}개월을 채웠어요 · 저장을 눌러주세요`)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#veil').classList.contains('hidden'))closeSheet()});
window.addEventListener('beforeunload',e=>{if(mode==='cloud'&&Object.keys(dirty).length){flush();e.preventDefault()}});

(async()=>{await initStore();render()})();
</script>
</body>
</html>
